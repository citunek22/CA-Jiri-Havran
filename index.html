<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Havran Jiří - Cestovní agentura Štětí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
--ink:#1B2A3C;
--ink-soft:#3C4C5E;
--paper:#F5F0E6;
--paper-dark:#EAE1CC;
--gold:#B8862E;
--gold-deep:#8F6620;
--teal:#3C6E68;
--line:#D2C4A0;
--white:#FFFDF8;

box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; scroll-padding-top:76px}

body{
margin:0;
background:var(--paper);
color:var(--ink);
font-family:"Work Sans", system-ui, sans-serif;
font-size:16px;
line-height:1.55;
-webkit-font-smoothing:antialiased;
}

h1,h2,h3{
font-family:"Fraunces", Georgia, serif;
font-weight:600;
color:var(--ink);
margin:0 0 .4em;
line-height:1.12;
}

a{color:inherit}
img{max-width:100%;display:block}

.wrap{
max-width:1080px;
margin:0 auto;
padding:0 24px;
}

/* ---------- perforated / airmail (pigeon) divider ---------------- */
.airmail-rule{
height:6px;
background:repeating-linear-gradient(
-55deg,
var(--teal) 0 14px,
var(--paper) 14px 20px,
var(--gold) 20px 34px,
var(--paper) 34px 40px
);
opacity:.85;
}

/* --------- nav ----------- */
header.site{
position:sticky;
top:0;
z-index:40;
background:rgba(245,240,230,.92);
backdrop-filter:blur(6px);
border-bottom:1px solid var(--line);
padding-top:env(safe-area-inset-top,0px);
}
nav{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 24px;
max-width:1080px;
margin:0 auto;
gap:16px;
}
.brand{
display:flex;
align-items:baseline;
gap:10px;
font-family:"Fraunces",serif;
font-weight:600;
font-size:1.25rem;
white-space:nowrap;
}
.brand small{
font-family:"Work Sans",sans-serif;
font-weight:500;
font-size:.62rem;
letter-spacing:.04em;
color:var(--teal)
}
.nav-links{
display:flex;
gap:26px;
list-style:none;
margin:0;
padding:0;
font-size:.94rem;
}
.nav links a{
text-decoration:none;
border-bottom:2px solid transparent;
padding-bottom:3px;
transition:border-color .15s ease;
}
.nav-links a:hover, .nav-links a:focus-visible{border-color:var(--gold)}

.status-chip{
display:inline-flex;
align-items:center;
gap:6px;
font-size:.78rem;
font-weight:500;
padding:6px 12px;
border:1px solid var(--line);
border-radius:999px;
background:var(--white);
white-space:nowrap;
}
.status-chip .dot{
width:7px;height:7px;border-radius:50%;
background:var(--teal);
}

.nav-toggle{display:none}

@media (max-width:720px){
.nav-links{
position:absolute;
top:100%;left:0;right:0;
flex-direction:column;
background:var(--paper);
border-bottom:1px solid var(--line);
padding:16px 24px 20px;
gap:14px;
display:none;
}
.nav-links.open{display:flex}
.nav-toggle{
display:inline-flex;
align-itens:center;
justify-content:center;
width:38px;height:38px;
border:1px solid var(--line);
background:var(--white);
border-radius:8px;
font-size:1.1rem;
cursor:pointer;
}
.status-chip{display:none}
}

/* ------- hero --------- */
.hero{
padding:64px 0 56px;
}
.hero-grid{
display:grid;
grid-template-columns:1.15fr .85fr;
gap:48px;
align-items:center;
}
.hero h1{
font-size:clamp(2.1rem, 4.6vw, 3.2rem);
max-width:11ch;
}
.hero p.lede{
font-size:1.08rem;
color:var(--ink-soft);
max-width:46ch;
margin:0 0 26px;
}
.hero-cta{
display:flex;
flex-wrap:wrap;
gap:12px;
}
.btn{
display:inline-block;
text-decoration:none;
font-weight:600;
font-size:.95rem;
padding:13px 24px;
border-radius:3px;
transition:transform .12s ease, box-shadow .12s ease;
border:none;
cursor:pointer;
}
.btn-primary{
background:var(--ink);
color:var(--white);
}
.btn-primary:hover{background:var(--gold-deep)}
.btn-primary:disabled{
background:#a0a0a0;
cursor:not-allowed;
}
.btn-ghost{
background:transparent;
color:var(--ink);
border:1.5px solid var(--ink);
}
.btn-ghost:hover{border-color:var(--gold-deep); color:var(--gold-deep)}

/* postcard/stamp graphic */
.postcard{
position:relative;
background:var(--white);
border:1px solid var(--line);
border-radius:2px;
padding:26px 24px;
box-shadow:0 1px 0 var(--line);
transform:rotate(2deg);
}
.postcard::before{
content:"";
position:absolute;
inset:8px;
border:1px dashed var(--gold);
pointer-events:none;
opacity:.55;
}
.postmark{
position:absolute;
top:-18px;
width:92px;height:92px;
border:2px solid var(--teal);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-family:"Fraunces",serif;
font-size:.62rem;
font-weight:600;
letter-spacing:.03em;
color:var(--teal);
background:var(--paper);
transform:rotate(-8deg);
line-height:1.25;
padding:6px;
}
.postcard h3{
font-size:1.05rem;
margin-bottom:10px;
color:var(--teal);
}
.postcard ul{
list-style:none;
margin:0;
padding:0;
font-size:.94rem;
}
.postcard li{
display:flex;
justify-content:space-between;
gap:12px;
padding:8px 0;
border-bottom:1px solid var(--paper-dark);
}
.postcard li:last-child{border-bottom:none}
.postcard li span:first-child{color:var(--ink-soft)}
.postcard li span:last-child{font-weight:600}

@media (max-width:820px){
.hero-grid{grid-template-columns:1fr}
.postcard{transform:none; max-width:420px}
}

/* ------- section shell --------- */
section{padding:64px 0}
.section-head{
max-width:56ch;
margin-bottom:34px;
}
.section-head h2{font-size:clamp(1.5rem,3vw,2rem)}
.section-head p{color:var(--ink-soft); font-size:1.02rem; margin:0}

/* ------------------ o ná ------------------------------ */
.about-cols{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}
.about-cols p{color:var(--ink-soft); max-width:52ch}
@media (max-width:720px){.about-cols{grid-template-columns:1fr}}

/* -------- nabídka CA (boarding-pass chips) --------------- */
.ck-grid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
gap:14px;
}
.ck-chip{
position:relaxive;
display:flex;
align-items:center;
gap:12px;
background:var(--white);
border:1px solid var(--line);
border-left:4px solid var(--teal);
padding:14px 16px;
font-weight:600;
font-size:.98rem;
}
.ck-chip .glyph{
font-family:"Fraunces",serif;
font-weight:700;
font-size:1rem;
color:var(--teal);
width:30px;height:30px;
border:1px solid var(--teal);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex:none
}
.ck-note{
margin-top:22px;
font-size:.88rem;
color:var(--ink-soft);
border-top:1px solid var(--line);
padding-top:16px;
}

/* ------------------------- solarium ----------------------- */
.solar{
display:grid;
grid-template-columns:1.2fr .8fr;
gap:44px;
align-items:start;
}
.solar-copy p{color:var(--ink-soft); max-width:50ch}
.ticket{
background:var(--ink);
color:var(--white);
padding:28px 26px;
position:relative;
border-radius:2px;
}
.ticket::after{
content:"";
position:absolute;
left:0;right:0;bottom:64px;
border-top:1px dashed rgba(255,255,255,.3);
}
.ticket .kicker{
font-size:.78rem;
color:var(--gold);
font-weight:600;
margin-bottom:6px;
}
.ticket h3{
color:var(--white);
font-size:1.3rem;
margin-bottom:4px;
}
.ticket .model{
font-size:.9rem;
color:#C9D2D8;
margin-bottom:22px;
}
.ticket .price{
display:flex;
align-items:baseline;
gap:8px;
margin-top:22px;
}
.ticket .price strong{
font-family:"Fraunces",serif;
font-size:2.4rem;
font-weight:600;
}
.ticket .price span{color:#C9D2D8; font-size:.92rem}

@media (max-width:820px){.solar{grid-template-columns:1fr}}

/* ----------- hodiny + kontakt --------------- */
.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}
table.hours{
width:100%;
border-collapse:collapse;
font-size:.98rem;
}
table.hours td{
padding:10px 0;
border-bottom:1px solid var(--paper-dark);
}
table.hours td:first-child{color:var(--ink-soft)}
table.hours td:last-child{text-align:right; font-weight:600}
table.hours tr.closed td:last-child{color:var(--gold-deep)}

.contact-list{list-style:none; margin:0; padding:0}
.contact-list li{
padding:12px 0;
border-bottom:1px solid var(--paper-dark);
display:flex;
flex-direction:column;
gap:2px;
}
.contact-list li span.label{font-size:.78rem; color:var(--ink-soft)}
.contact-list li a{
font-weight:600;
text-decoration:none;
font-size:1.02rem;
}
.contact-list li a:hover{color:var(--gold-deep)}

/* mapa container */
.map-wrap{
margin-top:34px;
border:1px solid var(--line);
background:var(--white);
padding:6px;
border-radius:2px;
}
.map-wrap iframe{
width:100%;
height:320px;
border:none;
display:block;
}

@media (max-width:720px){.info-grid{grid-template-columns:1fr}}

/* ------------------ formular ------------------ */
.form-shell{
background:var(--white);
border:1px solid var(--line);
padding:34px;
max-width:640px;
}
.field{margin-bottom:18px}
.field label{
display:block;
font-size:.86rem;
font-weight:600;
margin-bottom:6px;
color:var(--ink-soft);
}
.field input, .field textarea{
width:100%;
padding:11px 12px;
border:1px solid var(--line);
background:var(--paper);
font-family:inherit;
font-size:.98rem;
color:var(--ink);
border-radius:2px;
}
.field input:focus, .field textarea:focus{
outline:2px solid var(--teal);
outline-offset:1px;
}
.field textarea{resize:vertical; min-height:110px}
.form-status{font-size:.9rem; margin-top:14px; display:none; padding:10px; border-radius:2px;}
.form-status.ok{display:block; background:#d4edda; color:#155724; border:1px solid #c3e6cb;}
.form-status.err{display:block; background:#f8f7da; color:#721c24; border:1px solid #f5c6cb;}

/* --------------- footer --------------------- */
footer{
display:flex;
flex-wrap:wrap;
justify-content:space-between;
gap:16px;
font-size:.86rem;
color:var(--ink-soft);
}

@media (prefers-reduced-motion: reduce){
html{scroll-behavior:auto}
*{transition:none !important}
}
</style>
</head>
<body>

<header class="site">
<nav>
<div class="brand">CA Havran Jiří</div>
</nav>
</header>
</body>
</html>
